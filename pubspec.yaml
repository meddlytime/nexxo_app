name: nexxo
description: "Modern POS and intelligent inventory management system for restaurants."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter
    
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  shared_preferences: ^2.5.0
  mobile_scanner: ^6.0.0
  flutter_riverpod: ^2.6.1
  lucide_icons_flutter: ^3.1.22
  intl: ^0.19.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# Configuração do Ícone da Aplicação
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: true

  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_icon.png"

# Section específica do Flutter
flutter:
  uses-material-design: true

  # Registo de assets (imagens e recursos do projeto)
  assets:
    - assets/images/